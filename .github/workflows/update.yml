name: Update VPN pool

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect configs
        run: python collector.py

      - name: Deduplicate configs
        run: python deduplicate.py


      - name: Commit results
        run: |
          git config user.name "vpn-pool-bot"
          git config user.email "actions@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update VPN pool"
            git push
          fi
          
